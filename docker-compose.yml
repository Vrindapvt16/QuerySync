services:
  oracle:
    image: gvenzl/oracle-free:slim
    container_name: oracle-free
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD}
      APP_USER: ${APP_USER}
      APP_USER_PASSWORD: ${APP_USER_PASSWORD}
    ports:
      - "1521:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./sql/oracle:/scripts
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30

  mariadb:
    image: mariadb:11.8
    container_name: mariadb-oracle-mode
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: lab
    command: --sql-mode=ORACLE
    ports:
      - "3306:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./sql/mariadb:/scripts

volumes:
  oracle-data:
  mariadb-data: